name: Robot de noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/robot.yml", "scripts/robot.mjs", "scripts/og.py"]

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer noticias
        run: node scripts/robot.mjs

      - name: Fotos reales y vista previa (si faltan)
        run: |
          mkdir -p media
          UA="VibrasPositivasHM-robot/1.0 (https://ya-declararon.netlify.app; github.com/haroldco45)"
          get(){ [ -s "media/$1" ] || curl -fsSL -A "$UA" -o "media/$1" "https://commons.wikimedia.org/wiki/Special:FilePath/$2?width=1600" || rm -f "media/$1"; }
          get capitolio-1.jpg "Capitalio_National_de_Colombia,_Bogot%C3%A1.jpg"
          get capitolio-2.jpg "El_Capitolio_Nacional_(Bogot%C3%A1,_Colombia)_1.jpg"
          get capitolio-3.jpg "Capitolio_Nacional_en_la_lluvia_I.jpg"
          get capitolio-4.jpg "Capitolio_Nacional_de_Colombia.JPG"
          get capitolio-5.jpg "Capitolio_Nacional_de_la_Rep%C3%BAblica_de_Colombia.JPG"
          ls -la media
          if [ ! -s og-image.jpg ] && [ -s media/capitolio-1.jpg ]; then
            pip install --quiet pillow
            python3 scripts/og.py
          fi

      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json media og-image.jpg 2>/dev/null || git add data/noticias.json media
          git diff --cached --quiet || (git commit -m "[skip netlify] Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git push)
